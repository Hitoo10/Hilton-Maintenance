project_id = "shiftflow-maintenance"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "shiftflow://"
additional_redirect_urls = ["https://localhost", "shiftflow://**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "20MiB"

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.register-user]
verify_jwt = false

[functions.username-login]
verify_jwt = false

[functions.setup-admin-pin]
verify_jwt = false
