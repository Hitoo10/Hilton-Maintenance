name: Hilton Maintenance CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hilton-maintenance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app-checks:
    name: Expo and TypeScript checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: TypeScript check
        run: npm run typecheck
      - name: Validate Expo app configuration
        run: npx expo config --type public
      - name: Check Expo dependencies and project health
        run: npx expo-doctor
      - name: Bundle Android JavaScript
        run: npx expo export --platform android --output-dir dist-android-check

  android-emulator-smoke-test:
    name: Install and launch release candidate on Android emulator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager was not found on the runner"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm ci
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Build standalone release candidate for emulator test
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain
          APK="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "Gradle completed but did not produce an APK under android/app/build/outputs/apk"
            find app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          mkdir -p app/build/outputs/apk/release
          if [ "$APK" != "app/build/outputs/apk/release/app-release.apk" ]; then
            cp "$APK" app/build/outputs/apk/release/app-release.apk
          fi
      - name: Boot emulator, install app, and verify launch without Metro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -e
            APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk"
            test -s "$APK"
            adb install "$APK"
            adb logcat -c
            adb shell am force-stop com.technicians.hiltonmaintenance
            adb shell monkey -p com.technicians.hiltonmaintenance 1
            sleep 35
            adb shell pidof com.technicians.hiltonmaintenance
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | grep "com.technicians.hiltonmaintenance"
            adb logcat -d > emulator-logcat.txt
            if grep -E "FATAL EXCEPTION|Unable to load script|Application has not been registered" emulator-logcat.txt; then
              echo "Android emulator smoke test detected a fatal startup error"
              exit 1
            fi
            adb exec-out screencap -p > emulator-home.png
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hilton-android-emulator-diagnostics
          path: |
            emulator-logcat.txt
            emulator-home.png
          if-no-files-found: ignore
          retention-days: 7

  android-release-build:
    name: Generate standalone Android release APK
    runs-on: ubuntu-latest
    needs: [app-checks, android-emulator-smoke-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager was not found on the runner"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm ci
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Compile standalone release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain
          APK="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "Gradle completed but did not produce an APK under android/app/build/outputs/apk"
            find app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          mkdir -p app/build/outputs/apk/release
          if [ "$APK" != "app/build/outputs/apk/release/app-release.apk" ]; then
            cp "$APK" app/build/outputs/apk/release/app-release.apk
          fi
      - name: Verify APK bundle and signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'assets/index.android.bundle|assets/index.android.bundle.hbc'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
      - name: Upload standalone release APK
        uses: actions/upload-artifact@v4
        with:
          name: hilton-maintenance-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

  edge-function-checks:
    name: Supabase Edge Function checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check register-user
        run: deno check supabase/functions/register-user/index.ts
      - name: Check username-login
        run: deno check supabase/functions/username-login/index.ts
      - name: Check setup-admin-pin
        run: deno check supabase/functions/setup-admin-pin/index.ts
